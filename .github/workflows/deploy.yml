# GitHub Pages 배포 (GitHub Actions 방식) — 아직 사용하지 않음. 저장소를 만들고 push하면 동작합니다.
# 이 파일은 blog/ 폴더가 저장소의 맨 위(root)일 때 기준입니다.
# 운영 빌드(npm run build)만 올립니다. 승인(approved: true)된 글만 나가요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
