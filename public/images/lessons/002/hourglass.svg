<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1170" role="img" aria-labelledby="t d">
<title id="t">성경 한 장 지도: 모래시계 — 온 인류에서 좁아졌다가 다시 넓어져요</title>
<desc id="d">모래시계 모양의 성경 지도. 위쪽 끝은 온 인류이고, 아래로 이스라엘, 유다 지파(한 가문), 남은 자로 좁아져요. 다시 열두 제자(예수님과 함께한 제자들), 초대교회, 열방의 교회로 넓어지고, 아래쪽 끝은 환하게 빛나는 큰 방으로 하나님을 섬기며 돌아오는 사람들(온 인류)이 금빛 왕관을 함께 들고 있어요. 금빛 작은 왕관은 하나님이 사람에게 믿고 맡기신 것을 뜻해요. 위에서는 한 왕관을 모두가 받고, 좁은 목에서는 남을 위해 들고 가고, 아래에서는 많은 사람이 함께 들어요.</desc>
