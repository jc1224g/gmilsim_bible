<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d">
<title id="t">겨자씨가 큰 나무로 자라요 (막 4:31-32)</title>
<desc id="d">세 단계 그림. 얼굴이 있는 아주 작은 겨자씨, 해와 달 아래에서 자라는 싹(자고 깨는 동안에도 자라요), 그리고 새들이 가지에 깃든 큰 나무(새들이 깃들 만큼).</desc>
