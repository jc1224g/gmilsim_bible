text{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif;font-weight:800;text-anchor:middle;fill:#16233a}
.o{stroke:#16233a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.l{font-size:28px}
.ck{fill:#f4a6a6;opacity:.85}
.e{fill:#16233a}
.m{stroke:#16233a;stroke-width:2.5;fill:none;stroke-linecap:round}
</style>
<rect x="4" y="4" width="752" height="492" rx="36" fill="#fbf8f1" stroke="#f3ecdd" stroke-width="4"/>
