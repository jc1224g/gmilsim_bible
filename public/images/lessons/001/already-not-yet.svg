<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
<title id="t">하나님 나라: 이미 시작됐고, 아직 완성되지 않았어요</title>
<desc id="d">왼쪽에서 오른쪽으로 가는 타임라인. 이미: 언덕 위 십자가와 돌이 굴려진 빈 무덤, 이미 시작됐어요. 지금: 작은 사람들이 싹에 물을 주는 모습, 지금 자라는 중. 아직: 빛에 둘러싸인 생명나무와 강, 다시 오시는 날 완성.</desc>
<defs>
<radialGradient id="g"><stop offset="0" stop-color="#fff6d8"/><stop offset=".6" stop-color="#f6dc9c"/><stop offset="1" stop-color="#f6dc9c" stop-opacity="0"/></radialGradient>
</defs>
