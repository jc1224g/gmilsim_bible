<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">쉽게 배우는 성경 1강: 하나님 나라, 죽어서 가는 곳일까?</title>
<desc id="d">표지 그림. 왼쪽에 큰 제목 "하나님 나라, 죽어서 가는 곳일까?"와 "쉽게 배우는 성경 · 1강". 오른쪽 위에는 물음표가 붙은 구름, 아래에는 빛나는 왕관이 웃는 작은 땅(지구) 위에 떠 있고, 땅 위에 집과 나무가 있다.</desc>
