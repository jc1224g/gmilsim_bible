</g>
<rect x="547" y="290" width="96" height="44" rx="22" fill="#16233a"/>
<text class="k" x="595" y="321">영토</text>

<!-- questions -> answers -->
<text class="q" x="125" y="386">누가 다스려요?</text>
<text class="q" x="360" y="386">누가 그 나라 사람?</text>
<text class="q" x="595" y="386">어디까지?</text>
<path d="M113 404l12 12 12-12 M348 404l12 12 12-12 M583 404l12 12 12-12" stroke="#e8b65a" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
