<rect x="16" y="100" width="688" height="232" rx="116" fill="#f3ecdd" opacity=".55"/>
<rect x="16" y="100" width="688" height="232" rx="116" fill="none" stroke="#e8b65a" stroke-width="5" stroke-dasharray="2 13" stroke-linecap="round"/>
<path d="M217 216h51 M452 216h51" stroke="#e8b65a" stroke-width="6" stroke-linecap="round"/>
<circle cx="242" cy="216" r="7" fill="#e8b65a"/><circle cx="478" cy="216" r="7" fill="#e8b65a"/>

<!-- 1 sovereignty: crown with light -->
<circle cx="125" cy="216" r="92" fill="#f9e6bd" class="o" stroke-width="3"/>
<g stroke="#e8b65a" stroke-width="6" stroke-linecap="round" opacity=".9">
