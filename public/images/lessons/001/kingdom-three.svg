<circle cx="-6" cy="-17" r="2.4" fill="#16233a"/><circle cx="6" cy="-17" r="2.4" fill="#16233a"/>
<path d="M-5-9q5 4 10 0" stroke="#16233a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<circle class="ck" cx="-10" cy="-11" r="3.5"/><circle class="ck" cx="10" cy="-11" r="3.5"/>
</g>
