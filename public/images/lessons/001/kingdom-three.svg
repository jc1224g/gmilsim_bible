<!-- 3 land: round earth with tree and house -->
<circle cx="595" cy="216" r="92" fill="#e2f0f8" class="o" stroke-width="3"/>
<g transform="translate(595 240)">
<circle class="o" r="50" fill="#bfe0f2"/>
