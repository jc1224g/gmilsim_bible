<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="t d">
<title id="t">하나님 나라의 세 가지: 주권, 백성, 영토</title>
<desc id="d">사회 시간의 나라의 3요소를 하나님 나라에 맞춘 그림. 빛나는 왕관은 주권(누가 다스려요? 하나님이 왕), 손잡은 여러 사람은 백성(누가 그 나라 사람? 부르심 받은 사람들), 나무와 집이 있는 둥근 땅은 영토(어디까지? 온 땅)를 나타내고, 세 동그라미가 둥근 선 하나로 묶여 있다.</desc>
<style>
text{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',sans-serif;font-weight:700;text-anchor:middle}
.o{stroke:#16233a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.q{font-size:26px;fill:#5b6474;font-weight:600}
.a{font-size:29px;fill:#16233a;font-weight:800}
.k{font-size:26px;fill:#fbf8f1;font-weight:800}
.ck{fill:#f4a6a6;opacity:.85}
</style>
<rect x="4" y="4" width="712" height="532" rx="36" fill="#fbf8f1" stroke="#f3ecdd" stroke-width="4"/>
